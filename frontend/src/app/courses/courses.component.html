<div class="container">
  <div class="page-header">
    <h2>Courses</h2>
    <button *ngIf="auth.isAdmin() && !showForm" class="btn btn-primary" (click)="openAdd()">
      + Add Course
    </button>
  </div>

  <div *ngIf="error" class="alert-error">{{ error }}</div>

  <div *ngIf="showForm" class="card form-card">
    <h3>{{ editing ? 'Edit Course' : 'New Course' }}</h3>
    <form (ngSubmit)="submit()" #cf="ngForm" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label>Title</label>
          <input required name="title" [(ngModel)]="form.title" placeholder="Course title" />
        </div>
        <div class="form-group">
          <label>Instructor</label>
          <input required name="instructor" [(ngModel)]="form.instructor" placeholder="Instructor name" />
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea name="description" rows="3" [(ngModel)]="form.description"
          placeholder="What is this course about?"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary" [disabled]="submitting || cf.invalid">
          <span *ngIf="submitting" class="spinner"></span>
          {{ submitting ? 'Saving…' : (editing ? 'Save Changes' : 'Add Course') }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>

  <div *ngIf="loading" class="loading-spinner">Loading courses…</div>

  <div *ngIf="!loading && courses.length === 0 && !showForm" class="card">
    <div class="empty-state">
      No courses yet.<span *ngIf="auth.isAdmin()"> Click "+ Add Course" to create one.</span>
    </div>
  </div>

  <div *ngIf="!loading && courses.length > 0" class="card" style="padding: 0;">
    <table>
      <thead>
        <tr>
          <th>Title</th>
          <th>Instructor</th>
          <th>Description</th>
          <th>Created</th>
          <th *ngIf="auth.isAdmin()" class="col-actions">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let c of courses">
          <td>
            <a [routerLink]="['/courses', c.id]" class="table-link">{{ c.title }}</a>
          </td>
          <td>{{ c.instructor }}</td>
          <td class="text-muted">{{ c.description || '—' }}</td>
          <td class="timestamp">{{ c.createdAt | date:'mediumDate' }}</td>
          <td *ngIf="auth.isAdmin()" class="col-actions">
            <div class="actions">
              <button class="btn btn-secondary btn-sm" (click)="openEdit(c)">Edit</button>
              <button class="btn btn-danger btn-sm" (click)="deleteCourse(c)">Delete</button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
