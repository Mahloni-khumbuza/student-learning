<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h1>Student Learning System</h1>
      <p class="text-muted">
        {{ mode === 'login' ? 'Sign in as ' + form.role : 'Create a new ' + form.role + ' account' }}
      </p>
    </div>

    <div class="role-toggle">
      <button type="button"
              [class.active]="form.role === 'student'"
              (click)="setRole('student')">
        <span class="role-icon">&#127891;</span> Student
      </button>
      <button type="button"
              [class.active]="form.role === 'admin'"
              (click)="setRole('admin')">
        <span class="role-icon">&#128737;</span> Admin
      </button>
    </div>

    <div *ngIf="error" class="alert-error">{{ error }}</div>

    <form (ngSubmit)="submit()" #f="ngForm">
      <div *ngIf="mode === 'register'" class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input required name="name" [(ngModel)]="form.name"
                 placeholder="Jane" autocomplete="given-name" />
        </div>
        <div class="form-group">
          <label>Surname</label>
          <input required name="surname" [(ngModel)]="form.surname"
                 placeholder="Doe" autocomplete="family-name" />
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input required type="email" name="email" [(ngModel)]="form.email"
               placeholder="you@example.com" autocomplete="email" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input required type="password" name="password" [(ngModel)]="form.password"
               placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" autocomplete="current-password" minlength="6" />
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading || f.invalid">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading
            ? 'Please wait&hellip;'
            : (mode === 'login'
                ? (form.role === 'admin' ? 'Sign In as Admin' : 'Sign In as Student')
                : (form.role === 'admin' ? 'Create Admin Account' : 'Create Student Account')) }}
      </button>
    </form>

    <div class="login-footer">
      <span *ngIf="mode === 'login'">Don't have an account?</span>
      <span *ngIf="mode === 'register'">Already have an account?</span>
      <button class="btn-link" (click)="toggle()">
        {{ mode === 'login' ? 'Register' : 'Sign In' }}
      </button>
    </div>
  </div>
</div>
