<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h1>{{ mode === 'login' ? 'Welcome back' : 'Create your account' }}</h1>
      <p class="text-muted">
        {{ mode === 'login' ? 'Sign in to continue to the Student Learning System.' : 'Get started in less than a minute.' }}
      </p>
    </div>

    <div *ngIf="error" class="alert-error">{{ error }}</div>

    <form (ngSubmit)="submit()" #f="ngForm" novalidate>
      <div *ngIf="mode === 'register'" class="role-toggle">
        <button type="button" (click)="setRole('STUDENT')" [class.active]="form.role === 'STUDENT'">
          <span class="role-icon">🎓</span> Student
        </button>
        <button type="button" (click)="setRole('ADMIN')" [class.active]="form.role === 'ADMIN'">
          <span class="role-icon">🛡️</span> Admin
        </button>
      </div>

      <div *ngIf="mode === 'register'" class="form-group">
        <label>Full Name</label>
        <input required name="fullName" [(ngModel)]="form.fullName" placeholder="Jane Doe" />
      </div>

      <div *ngIf="mode === 'register'" class="form-group">
        <label>Email</label>
        <input required type="email" name="email" [(ngModel)]="form.email" placeholder="jane@example.com" />
      </div>

      <div class="form-group">
        <label>Username</label>
        <input required name="username" [(ngModel)]="form.username" placeholder="janedoe" autocomplete="username" />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input required type="password" name="password" [(ngModel)]="form.password" placeholder="••••••••"
          [attr.autocomplete]="mode === 'login' ? 'current-password' : 'new-password'" />
      </div>

      <button type="submit" class="btn btn-primary btn-full" [disabled]="loading || f.invalid">
        <span *ngIf="loading" class="spinner"></span>
        {{ loading ? 'Please wait…' : (mode === 'login' ? 'Login' : 'Create account') }}
      </button>
    </form>

    <div class="login-footer">
      <span>{{ mode === 'login' ? "Don't have an account?" : 'Already have an account?' }}</span>
      <button type="button" class="btn-link" (click)="toggle()">
        {{ mode === 'login' ? 'Register' : 'Sign in' }}
      </button>
    </div>
  </div>
</div>
