<div class="container">
  <div class="page-header">
    <h2>Students</h2>
    <span *ngIf="!loading" class="badge badge-blue">{{ students.length }} total</span>
  </div>

  <div *ngIf="error" class="alert-error">{{ error }}</div>

  <div *ngIf="loading" class="loading-spinner">Loading students…</div>

  <div *ngIf="!loading && students.length === 0" class="card">
    <div class="empty-state">No students found.</div>
  </div>

  <div *ngIf="!loading && students.length > 0" class="card" style="padding: 0;">
    <table>
      <thead>
        <tr>
          <th>Full Name</th>
          <th>Username</th>
          <th>Email</th>
          <th>Role</th>
          <th>Joined</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of students">
          <td>
            <a [routerLink]="['/students', s.id]" class="table-link">{{ s.fullName }}</a>
          </td>
          <td class="text-muted">{{ s.username }}</td>
          <td class="text-muted">{{ s.email }}</td>
          <td>
            <span class="badge" [class.badge-purple]="s.role === 'ADMIN'" [class.badge-green]="s.role === 'STUDENT'">
              {{ s.role }}
            </span>
          </td>
          <td class="timestamp">{{ s.createdAt | date:'mediumDate' }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
